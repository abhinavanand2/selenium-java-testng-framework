name: Selenium Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  selenium-tests:

    name: Selenium TestNG Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Selenium tests
        run: mvn clean test -Dbrowser=chrome -Dheadless=true

      - name: Upload TestNG reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: |
            target/surefire-reports/
            test-output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: test-output/screenshots/
          if-no-files-found: ignore
          retention-days: 7